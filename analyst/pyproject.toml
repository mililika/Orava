[project]
name = "orava-analyst"
version = "0.1.0"
description = "Local, privacy-conscious analyst chatbot for the Junction dataset"
requires-python = ">=3.11"
dependencies = [
  "google-genai>=3.3,<4",
  "duckdb>=1.2,<2",
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<9", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

